# CI workflow for HushServerNode (.NET)
# Triggers on any code change (no path filter needed — whole repo is the server)

name: CI - HushServerNode

on:
  push:
    branches: [ "master" ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Node

    steps:
    - uses: actions/checkout@v5

    - name: Checkout hush-web-client
      uses: actions/checkout@v5
      with:
        repository: Hushnetwork-social/hush-web-client
        ref: master
        path: hush-web-client

    - name: Checkout Dispute-Continuity-Matrix
      uses: actions/checkout@v5
      with:
        repository: Hushnetwork-social/Dispute-Continuity-Matrix
        ref: main
        path: Dispute-Continuity-Matrix

    - name: Checkout Governance-Customer-Handoff
      uses: actions/checkout@v5
      with:
        repository: Hushnetwork-social/Governance-Customer-Handoff
        ref: main
        path: Governance-Customer-Handoff

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup Rust
      working-directory: .
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: hush-web-client/package-lock.json

    - name: Install hush-web-client dependencies
      working-directory: hush-web-client
      run: npm ci

    - name: Restore dependencies
      run: dotnet restore

    - name: Build SP-07 Rust worker
      working-directory: Tools/HushSp07RustWorker
      run: cargo build --release --locked

    - name: Test SP-07 Rust worker
      working-directory: Tools/HushSp07RustWorker
      run: cargo test --release --locked

    - name: Build
      run: dotnet build --no-restore

    - name: Unit Tests
      env:
        HUSH_SERVER_NODE_ROOT: ${{ github.workspace }}
        HUSH_WEB_CLIENT_ROOT: ${{ github.workspace }}/hush-web-client
        HUSH_SP07_RUST_WORKER_PATH: ${{ github.workspace }}/Tools/HushSp07RustWorker/target/release/hush-sp07-rust-worker
      run: bash ../.github/scripts/run-dotnet-test-projects.sh

  hushvoting-server-twins:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hush-server-node
    env:
      HUSHVOTING_E2E_CLIENT_ROOT: ${{ github.workspace }}/hush-voting-web-client
    steps:
    - uses: actions/checkout@v5
      with:
        path: hush-server-node
    - name: Checkout HushVoting client
      uses: actions/checkout@v5
      with:
        repository: Hushnetwork-social/hush-voting-web-client
        # Validated companion revision for this migration; keep CI reproducible
        # while the two independently versioned repositories are published.
        ref: 3667e6a7c77057d7d8f72fa5aa30a14044330c25
        path: hush-voting-web-client
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: hush-voting-web-client/package-lock.json
    - name: Install HushVoting dependencies
      working-directory: hush-voting-web-client
      run: npm ci
    - name: Build Rust worker
      working-directory: hush-server-node/Tools/HushSp07RustWorker
      run: cargo build --release --locked
    - name: Restore integration projects
      run: dotnet restore Node/HushNode.IntegrationTests/HushNode.IntegrationTests.csproj
    - name: Run supervised HushVoting Server Twin groups
      run: bash .github/scripts/run-hushvoting-server-twins.sh
    - name: Shut down build servers
      if: always()
      run: dotnet build-server shutdown
